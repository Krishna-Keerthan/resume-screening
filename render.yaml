
# render.yaml — Render deployment configuration
# Field names: https://render.com/docs/blueprint-spec
# Schema:      https://render.com/schema/render.yaml.json
#
# Render reads this file from the repository root. The backend lives in backend/, so the
# web service sets rootDir: backend and its build and start commands run from there.

services:
  - type: web
    name: ats-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt && python -m scripts.download_model
    startCommand: alembic upgrade head && gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17   # same as python:3.11-slim in Dockerfile; torch 2.3.0 has no 3.13 wheels
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # Set in Render dashboard: Supabase SESSION pooler, port 5432 (never 6543)
      - key: RATE_LIMIT_STORAGE_URL
        fromService:
          type: keyvalue
          name: ats-ratelimit
          property: connectionString   # production refuses memory://
      # The build command downloads the model; load it from there, never from the network.
      - key: EMBEDDING_OFFLINE
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "2"   # Vercel, then Render's proxy; verify with LOG_PROXY_CHAIN
      - key: LOG_PROXY_CHAIN
        value: "true"   # TEMPORARY: set to false or delete once the hop count is verified
      - key: ALLOWED_ORIGINS
        sync: false   # Set in Render dashboard — your Vercel URL
      - key: GROQ_API_KEY
        sync: false   # Set in Render dashboard
      # Render's disk is wiped on every deploy: résumés live in a PRIVATE Supabase Storage bucket.
      # The app refuses to start if any of the three values below is empty.
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false   # Set in Render dashboard: https://<project>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # Set in Render dashboard; server-side only, never in the frontend
      - key: SUPABASE_BUCKET
        sync: false   # Set in Render dashboard: the private bucket's name
      - key: LOG_LEVEL
        value: WARNING
      - key: LOG_FORMAT
        value: json
    healthCheckPath: /api/v1/health

  # Shared rate-limit counters for every gunicorn worker. Internal traffic only.
  - type: keyvalue
    name: ats-ratelimit
    plan: free
    ipAllowList: []
