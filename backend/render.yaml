
# render.yaml — Render deployment configuration
# https://render.com/docs/render-yaml

services:
  - type: web
    name: ats-backend
    runtime: python
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: alembic upgrade head && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17   # same as python:3.11-slim in Dockerfile; torch 2.3.0 has no 3.13 wheels
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ats-postgres
          property: connectionString
      - key: RATE_LIMIT_STORAGE_URL
        fromService:
          type: keyvalue
          name: ats-ratelimit
          property: connectionString   # production refuses memory://
      - key: TRUSTED_PROXY_HOPS
        value: "2"   # Vercel, then Render's proxy; verify with LOG_PROXY_CHAIN
      - key: LOG_PROXY_CHAIN
        value: "true"   # TEMPORARY: set to false or delete once the hop count is verified
      - key: ALLOWED_ORIGINS
        sync: false   # Set in Render dashboard — your Vercel URL
      - key: GROQ_API_KEY
        sync: false   # Set in Render dashboard
      - key: LOG_LEVEL
        value: WARNING
      - key: LOG_FORMAT
        value: json
      - key: WORKERS
        value: "2"
    healthCheckPath: /api/v1/health

  # Shared rate-limit counters for every gunicorn worker. Internal traffic only.
  - type: keyvalue
    name: ats-ratelimit
    plan: free
    ipAllowList: []

databases:
  - name: ats-postgres
    plan: free
    databaseName: ats_db
    user: ats_user